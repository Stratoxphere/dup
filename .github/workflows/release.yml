name: Release Dup
run-name: Release Dup from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source tag, for example v1.20260903.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dup-release-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    environment: release
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      public_version: ${{ steps.version.outputs.public_version }}
      windows_version: ${{ steps.version.outputs.windows_version }}
    steps:
      - name: Checkout immutable source tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source tag and commit
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REF" =~ ^v(0|[1-9][0-9]*)\.[0-9]{8}\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid source tag: $SOURCE_REF" >&2
            exit 1
          fi

          tag_ref="refs/tags/$SOURCE_REF"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "The source ref must be an annotated tag: $SOURCE_REF." >&2
            exit 1
          fi

          source_sha="$(git rev-parse "$tag_ref^{}")"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo "The checkout is not the immutable source tag $SOURCE_REF." >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify public and platform versions
        id: version
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourceRef = process.env.SOURCE_REF;
          const match = /^v(0|[1-9][0-9]*)\.([0-9]{4})([0-9]{2})([0-9]{2})\.(0|[1-9][0-9]*)$/.exec(sourceRef);
          if (!match) throw new Error(`Invalid source tag: ${sourceRef}`);

          const [, majorText, yearText, monthText, dayText, patchText] = match;
          const major = Number(majorText);
          const year = Number(yearText);
          const month = Number(monthText);
          const day = Number(dayText);
          const patch = Number(patchText);
          const date = new Date(Date.UTC(year, month - 1, day));
          if (
            major > 255 ||
            patch > 99 ||
            year < 2000 ||
            year > 2255 ||
            date.getUTCFullYear() !== year ||
            date.getUTCMonth() !== month - 1 ||
            date.getUTCDate() !== day
          ) {
            throw new Error(`Invalid release version: ${sourceRef}`);
          }

          const publicVersion = sourceRef.slice(1);
          const dayOfYear = Math.floor((date.getTime() - Date.UTC(year, 0, 1)) / 86_400_000) + 1;
          const windowsVersion = `${major}.${year - 2000}.${dayOfYear * 100 + patch}`;
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const windows = JSON.parse(fs.readFileSync('src-tauri/tauri.windows.conf.json', 'utf8'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');
          const cargoVersion = /^version = "([^"]+)"$/m.exec(cargo)?.[1];
          const lockVersion = /\[\[package\]\]\nname = "dup"\nversion = "([^"]+)"/.exec(cargoLock)?.[1];

          const publicVersions = {
            'package.json': packageVersion,
            'src-tauri/Cargo.toml': cargoVersion,
            'src-tauri/Cargo.lock': lockVersion,
            'src-tauri/tauri.conf.json': tauri.version
          };
          for (const [file, version] of Object.entries(publicVersions)) {
            if (version !== publicVersion) {
              throw new Error(`${file} has version ${version ?? '<missing>'}; expected ${publicVersion}`);
            }
          }
          if (tauri.identifier !== 'app.stratoxphere.dup') {
            throw new Error(`Unexpected Tauri identifier: ${tauri.identifier}`);
          }
          if (windows.version !== windowsVersion || windows.bundle?.windows?.wix?.version !== windowsVersion) {
            throw new Error(`Windows bundle version must be ${windowsVersion}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `public_version=${publicVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `windows_version=${windowsVersion}\n`);
          NODE

      - name: Create Bot installation token
        id: bot-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.STRATOXPHERE_BOT_APP_ID }}
          private-key: ${{ secrets.STRATOXPHERE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Refuse an existing public tag or release
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_REF" >/dev/null 2>&1; then
            echo "The public tag $SOURCE_REF already exists and will not be reused." >&2
            exit 1
          fi
          if gh release view "$SOURCE_REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The public release $SOURCE_REF already exists and will not be replaced." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            bundle: src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact: dup-macos-aarch64
          - label: Windows
            os: windows-latest
            args: ''
            bundle: src-tauri/target/release/bundle
            artifact: dup-windows-x86_64
          - label: Linux
            os: ubuntu-latest
            args: ''
            bundle: src-tauri/target/release/bundle
            artifact: dup-linux-x86_64
    steps:
      - name: Checkout validated source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.preflight.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify preflight commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libxtst-dev libdbus-1-dev libpipewire-0.3-dev \
            libgbm-dev

      - name: Install NASM
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-03
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Require Apple signing and notarization credentials
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required release secret: $value" >&2
              exit 1
            fi
          done

      - name: Stage App Store Connect API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          test -s "$key_path"
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: JHEN-KE LIN (5H75SGA7KP)'
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        with:
          args: ${{ matrix.args }}

      - name: Notarize and staple macOS disk image
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for app in ${{ matrix.bundle }}/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute -vv "$app"
          done
          for dmg in ${{ matrix.bundle }}/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage

  release:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Create Bot installation token
        id: bot-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.STRATOXPHERE_BOT_APP_ID }}
          private-key: ${{ secrets.STRATOXPHERE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout public release repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ steps.bot-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release assets
        env:
          PUBLIC_VERSION: ${{ needs.preflight.outputs.public_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          WINDOWS_VERSION: ${{ needs.preflight.outputs.windows_version }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          output = Path('release-assets')
          output.mkdir()
          binaries = sorted(path for path in Path('artifacts').rglob('*') if path.is_file())
          if not binaries:
              raise SystemExit('No build artifacts were downloaded.')
          for source in binaries:
              destination = output / source.name
              if destination.exists():
                  raise SystemExit(f'Duplicate release asset name: {source.name}')
              shutil.copy2(source, destination)
          for name in ('terms-of-service.md', 'privacy-policy.md'):
              shutil.copy2(name, output / name)

          metadata = {
              'product': 'Dup',
              'version': os.environ['PUBLIC_VERSION'],
              'sourceRef': os.environ['SOURCE_REF'],
              'windowsBundleVersion': os.environ['WINDOWS_VERSION'],
          }
          (output / 'release.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')

          checksums = []
          for path in sorted(output.iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f'{digest}  {path.name}')
          (output / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          PY

      - name: Create verified draft and publish it
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PUBLIC_VERSION: ${{ needs.preflight.outputs.public_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Official Dup ${PUBLIC_VERSION} installers.

          Source tag: \`${SOURCE_REF}\`
          This release is governed by the Terms of Service and Privacy Policy stored with this tag.
          EOF

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were assembled." >&2
            exit 1
          fi

          gh release create "$SOURCE_REF" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Dup ${PUBLIC_VERSION}" \
            --notes-file release-notes.md \
            --draft

          expected="${#assets[@]}"
          actual="$(gh release view "$SOURCE_REF" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release has $actual assets; expected $expected. It remains a draft." >&2
            exit 1
          fi
          gh release edit "$SOURCE_REF" --repo "$GITHUB_REPOSITORY" --draft=false
